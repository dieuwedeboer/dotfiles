include=/usr/local/share/omarchy/config/foot/foot.ini
# Final point size, as Alacritty's source also holds it: Omarchy's 12px maps to
# 9pt and apply-font-size adds MONARCHY_FONT_PT_OFFSET (3). Keep this in step
# with ~/.config/environment.d/monarchy.conf, or chezmoi apply undoes the hook.
font=JetBrainsMono Nerd Font:size=12

[colors-dark]
# MONARCHY_ALPHA
alpha=0.88

# Omarchy migrations 1780057136 and 1785633225 appended [text-bindings] and
# [scrollback] multiplier=7.0 here. Deliberately not kept: the include above
# already supplies both, and a local copy would silently outrank the upstream
# value once Omarchy changes it. Only genuine deltas belong in this file.
