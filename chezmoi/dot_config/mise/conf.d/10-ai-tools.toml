# mise holds every new release for 24 hours by default, so `mise upgrade` runs
# a day behind:
#
#   newer claude release 2.1.280 (released 2026-09-23, eligible 2026-09-24
#   04:38 NZST) ignored by minimum_release_age (24h)
#
# That cooling-off is worth having on a toolchain. It is not worth having on
# the coding agents, which ship several releases a day and whose fixes are the
# reason to upgrade at all. These names are exempt; everything else in
# ~/.config/mise/config.toml (bun, gh, ...) keeps the 24 hours.
#
# Why conf.d rather than config.toml: mise reads ~/.config/mise/conf.d/*.toml
# and only ever writes config.toml. `mise use -g` and `mise settings set` can
# therefore never collide with this file, so chezmoi owns it outright.
#
# cursor-agent is here for the alias Omarchy declares in
# /etc/mise/conf.d/omarchy.toml; on these boxes Cursor comes from pacman
# instead, so the row is inert until it does not.

[settings]
minimum_release_age_excludes = [
    "claude",
    "codex",
    "opencode",
    "npm:@xai-official/grok",
    "cursor-agent",
]
